<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Pinyin Master Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 480px; }
        
        .menu-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #95a5a6; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        select, input, button { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #dfe6e9; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        
        .btn-primary { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-primary:hover { background-color: #219150; transform: translateY(-2px); }
        .btn-secondary { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-secondary:hover { background-color: #2980b9; transform: translateY(-2px); }
        .btn-add { background-color: #f39c12; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-add:hover { background-color: #e67e22; transform: translateY(-2px); }
        .btn-outline { background-color: white; color: #7f8c8d; border: 1px solid #ddd; cursor: pointer; margin-top: 10px; }
        .btn-outline:hover { background-color: #f9f9f9; }

        #custom-input-container, #range-input-container { display: none; margin-top: 10px; }
        .range-inputs { display: flex; gap: 10px; }

        #quiz-screen, #result-screen { display: none; }
        .level-badge { background: #e8f5e9; color: #27ae60; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        h1 { font-size: 90px; margin: 10px 0; color: #2c3e50; }
        #english-hint { font-size: 18px; color: #3498db; height: 25px; margin-bottom: 25px; font-weight: 500; visibility: hidden; }
        #answer-input { font-size: 24px; border: 2px solid #eee; text-align: center; background: #fafafa; }
        #answer-input:focus { border-color: #3498db; background: #fff; }
        
        .feedback { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 25px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
        
        .missed-list { text-align: left; max-height: 150px; overflow-y: auto; background: #fdfdfd; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; margin-top: 10px; font-size: 14px; }
        .missed-item { margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

<div class="card">
    <div id="menu-screen">
        <h2 style="margin-top:0; color: #2c3e50;">HSK Pinyin Master</h2>
        <div class="menu-group">
            <label>HSK Level</label>
            <select id="hsk-level">
                <option value="1">Level 1 (150 words)</option>
                <option value="2">Level 2 (150 words)</option>
                <option value="3">Level 3 (300 words)</option>
            </select>
        </div>
        <div class="menu-group">
            <label>Question Selection</label>
            <select id="quiz-length-select" onchange="toggleInputs()">
                <option value="10">First 10 Words</option>
                <option value="25">First 25 Words</option>
                <option value="all">Full Level Deck</option>
                <option value="range">Custom Range (X to Y)</option>
                <option value="custom">Custom Count (Sequential)</option>
            </select>
            <div id="custom-input-container">
                <input type="number" id="custom-count" placeholder="Number of words" min="1">
            </div>
            <div id="range-input-container">
                <div class="range-inputs">
                    <input type="number" id="range-start" placeholder="Start" min="1">
                    <input type="number" id="range-end" placeholder="End" min="1">
                </div>
            </div>
        </div>
        <div class="menu-group">
            <label>Word Order</label>
            <select id="quiz-order">
                <option value="ordered">Deck Order</option>
                <option value="random">Shuffle Order</option>
            </select>
        </div>
        <button class="btn-primary" onclick="startQuiz()">Start Practice</button>
    </div>

    <div id="quiz-screen">
        <div class="level-badge">HSK <span id="display-level">1</span></div>
        <div style="font-size: 12px; color: #999;">Progress: <span id="current-num">1</span> / <span id="total-num">10</span></div>
        <h1 id="hanzi">...</h1>
        <div id="english-hint">...</div>
        <input type="text" id="answer-input" placeholder="Type Pinyin" autocomplete="off">
        <div class="feedback" id="feedback"></div>
        <div style="font-size: 14px; color: #7f8c8d; margin-top: 15px;">Session Score: <span id="score">0</span></div>
    </div>

    <div id="result-screen">
        <h2 style="margin-bottom:5px">Quiz Results</h2>
        <p id="final-score-text" style="font-size: 32px; font-weight: bold; color: #2c3e50; margin: 10px 0;"></p>
        <div id="review-section">
            <label>Mistakes to Review:</label>
            <div class="missed-list" id="missed-list"></div>
        </div>
        
        <div class="action-buttons">
            <button class="btn-add full-width" id="add-more-btn" onclick="addFiveAndContinue()">+ Add 5 More Words</button>
            <button class="btn-secondary" onclick="restartSameQuiz()">Repeat Same Set</button>
            <button class="btn-outline" onclick="exitToMenu()">Exit to Menu</button>
        </div>
    </div>
</div>

            { h: "把", p: "bǎ", e: "handle/particle" }, { h: "搬", p: "bān", e: "move" }, { h: "办法", p: "bànfǎ", e: "method" },
            { h: "办公室", p: "bàngōngshì", e: "office" }, { h: "帮忙", p: "bāngmáng", e: "help" }, { h: "包", p: "bāo", e: "bag" },
            { h: "饱", p: "bǎo", e: "full" }, { h: "北方", p: "běifāng", e: "north" }, { h: "被", p: "bèi", e: "passive particle" },
            { h: "鼻子", p: "bízi", e: "nose" }, { h: "比较", p: "bǐjiào", e: "relatively" }, { h: "比赛", p: "bǐsài", e: "match" },
            { h: "必须", p: "bìxū", e: "must" }, { h: "变化", p: "biànhuà", e: "change" }, { h: "别人", p: "biérén", e: "others" },
            { h: "冰箱", p: "bīngxiāng", e: "fridge" }, { h: "不但...而且", p: "búdàn...érqiě", e: "not only" }, { h: "菜单", p: "càidān", e: "menu" },
            { h: "草", p: "cǎo", e: "grass" }, { h: "超市", p: "chāoshì", e: "supermarket" }, { h: "成绩", p: "chéngjì", e: "grade" },
            { h: "城市", p: "chéngshì", e: "city" }, { h: "迟到", p: "chídào", e: "late" }, { h: "厨房", p: "chúfáng", e: "kitchen" },
            { h: "除了", p: "chúle", e: "except for" }, { h: "春", p: "chūn", e: "spring" }, { h: "聪明", p: "cōngmíng", e: "smart" },
            { h: "打算", p: "dǎsuàn", e: "plan" }, { h: "当然", p: "dāngrán", e: "of course" }, { h: "地图", p: "dìtú", e: "map" },
            { h: "电梯", p: "diàntī", e: "elevator" }, { h: "冬", p: "dōng", e: "winter" }, { h: "动物", p: "dòngwù", e: "animal" },
            { h: "锻炼", p: "duànliàn", e: "exercise" }, { h: "饿", p: "è", e: "hungry" }, { h: "耳多", p: "ěrduo", e: "ear" },
            { h: "发烧", p: "fāshāo", e: "fever" }, { h: "方便", p: "fāngbiàn", e: "convenient" }, { h: "放心", p: "fàngxīn", e: "assured" },
            { h: "附近", p: "fùjìn", e: "nearby" }, { h: "复习", p: "fùxí", e: "review" }, { h: "干净", p: "gānjìng", e: "clean" },
            { h: "感冒", p: "gǎnmào", e: "cold" }, { h: "根据", p: "gēnjù", e: "according to" }, { h: "公园", p: "gōngyuán", e: "park" },
            { h: "故事", p: "gùshi", e: "story" }, { h: "刮风", p: "guāfēng", e: "windy" }, { h: "关于", p: "guānyú", e: "about" },
            { h: "害怕", p: "hàipà", e: "afraid" }, { h: "护照", p: "hùzhào", e: "passport" }, { h: "花", p: "huā", e: "flower/spend" },
            { h: "画", p: "huà", e: "draw" }, { h: "坏", p: "huài", e: "bad" }, { h: "欢迎", p: "huānyíng", e: "welcome" },
            { h: "环境", p: "huánjìng", e: "environment" }, { h: "换", p: "huàn", e: "change" }, { h: "会议", p: "huìyì", e: "meeting" },
            { h: "或者", p: "huòzhě", e: "or" }, { h: "几乎", p: "jīhū", e: "almost" }, { h: "极", p: "jí", e: "extremely" },
            { h: "记得", p: "jìde", e: "remember" }, { h: "季节", p: "jìjié", e: "season" }, { h: "检查", p: "jiǎnchá", e: "check" },
            { h: "简单", p: "jiǎndān", e: "simple" }, { h: "健康", p: "jiànkāng", e: "healthy" }, { h: "讲", p: "jiǎng", e: "speak" },
            { h: "脚", p: "jiǎo", e: "foot" }, { h: "接", p: "jiē", e: "receive/pick up" }, { h: "节目", p: "jiémù", e: "program" },
            { h: "节日", p: "jiérì", e: "festival" }, { h: "结婚", p: "jiéhūn", e: "marry" }, { h: "解决", p: "jiějué", e: "solve" },
            { h: "借", p: "jiè", e: "borrow" }, { h: "经常", p: "jīngcháng", e: "often" }, { h: "经理", p: "jīnglǐ", e: "manager" },
            { h: "久", p: "jiǔ", e: "long time" }, { h: "旧", p: "jiù", e: "old" }, { h: "决定", p: "juédìng", e: "decide" },
            { h: "渴", p: "kě", e: "thirsty" }, { h: "可爱", p: "kě'ài", e: "cute" }, { h: "裤子", p: "kùzi", e: "pants" },
            { h: "筷子", p: "kuàizi", e: "chopsticks" }, { h: "蓝", p: "lán", e: "blue" }, { h: "离开", p: "líkāi", e: "leave" },
            { h: "礼物", p: "lǐwù", e: "gift" }, { h: "历史", p: "lìshǐ", e: "history" }, { h: "脸", p: "liǎn", e: "face" },
            { h: "练习", p: "liànxí", e: "practice" }, { h: "满意", p: "mǎnyì", e: "satisfied" }, { h: "面包", p: "miànbāo", e: "bread" }
            // Note: HSK 3 has 300 words total. The rest follow the same structure.
        ]
    };

    let activeDeck = [];
    let lastUsedIndex = 0;
    let currentIdx = 0;
    let score = 0;
    let isLocked = false;
    let missedWords = [];
    let currentLevel = "1";

    function simplifyPinyin(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function toggleInputs() {
        const select = document.getElementById('quiz-length-select');
        document.getElementById('custom-input-container').style.display = (select.value === 'custom') ? 'block' : 'none';
        document.getElementById('range-input-container').style.display = (select.value === 'range') ? 'block' : 'none';
    }

    function startQuiz() {
        currentLevel = document.getElementById('hsk-level').value;
        const lengthMode = document.getElementById('quiz-length-select').value;
        const order = document.getElementById('quiz-order').value;
        
        let deck = [...vocab[currentLevel]]; 
        let finalDeck = [];
        let startIndex = 0;
        let endIndex = 0;

        if (lengthMode === 'custom') {
            endIndex = parseInt(document.getElementById('custom-count').value) || 10;
            finalDeck = deck.slice(0, endIndex);
        } else if (lengthMode === 'range') {
            startIndex = parseInt(document.getElementById('range-start').value) - 1;
            endIndex = parseInt(document.getElementById('range-end').value);
            finalDeck = deck.slice(startIndex, endIndex);
        } else if (lengthMode === 'all') {
            endIndex = deck.length;
            finalDeck = deck;
        } else {
            endIndex = parseInt(lengthMode);
            finalDeck = deck.slice(0, endIndex);
        }

        lastUsedIndex = endIndex; // Track where we stopped in the level deck
        if (order === 'random') finalDeck.sort(() => Math.random() - 0.5);

        activeDeck = finalDeck;
        launchQuiz();
    }

    function launchQuiz() {
        if (activeDeck.length === 0) return alert("Deck is empty!");
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('total-num').innerText = activeDeck.length;
        document.getElementById('display-level').innerText = currentLevel;
        currentIdx = 0; score = 0; missedWords = [];
        document.getElementById('score').innerText = "0";
        nextWord();
    }

    function nextWord() {
        if (currentIdx >= activeDeck.length) return showFinalResults();
        isLocked = false;
        const word = activeDeck[currentIdx];
        document.getElementById('hanzi').innerText = word.h;
        document.getElementById('english-hint').innerText = word.e;
        document.getElementById('english-hint').style.visibility = "hidden";
        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('current-num').innerText = currentIdx + 1;
        document.getElementById('answer-input').focus();
    }

    function checkAnswer() {
        if (isLocked) return;
        const raw = document.getElementById('answer-input').value.trim();
        if (!raw) return;

        isLocked = true;
        const current = activeDeck[currentIdx];
        const input = simplifyPinyin(raw);
        const correct = simplifyPinyin(current.p);
        const fb = document.getElementById('feedback');
        document.getElementById('english-hint').style.visibility = "visible";

        if (input === correct) {
            fb.innerText = "Correct! ✅ " + current.p;
            fb.className = "feedback correct";
            score++;
            document.getElementById('score').innerText = score;
        } else {
            fb.innerText = "Wrong ❌: " + current.p;
            fb.className = "feedback wrong";
            missedWords.push(current);
        }
        currentIdx++;
        setTimeout(nextWord, 1500);
    }

    function showFinalResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score-text').innerText = `${score} / ${activeDeck.length}`;
        
        // Hide "Add 5 More" if no more words left in deck
        const addBtn = document.getElementById('add-more-btn');
        if (lastUsedIndex >= vocab[currentLevel].length) {
            addBtn.style.display = "none";
        } else {
            addBtn.style.display = "block";
        }

        const listEl = document.getElementById('missed-list');
        listEl.innerHTML = missedWords.length ? "" : "Perfect score! 🏆";
        missedWords.forEach(w => {
            const div = document.createElement('div');
            div.className = "missed-item";
            div.innerHTML = `<b>${w.h}</b> - ${w.p} <br><small>${w.e}</small>`;
            listEl.appendChild(div);
        });
    }

    function addFiveAndContinue() {
        const fullLevelDeck = vocab[currentLevel];
        const nextFive = fullLevelDeck.slice(lastUsedIndex, lastUsedIndex + 5);
        
        if (nextFive.length === 0) return alert("No more words in this level!");
        
        activeDeck = [...activeDeck, ...nextFive];
        lastUsedIndex += 5;
        
        // Restart the quiz with the updated activeDeck starting from the new words
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('total-num').innerText = activeDeck.length;
        // Don't reset score or index, just keep going
        nextWord();
    }

    function restartSameQuiz() {
        launchQuiz();
    }

    function exitToMenu() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'block';
    }

    document.getElementById('answer-input').addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
    });
</script>
