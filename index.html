<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Pinyin Master</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 420px; }
        
        .menu-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        select, input, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; outline: none; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #219150; }
        
        /* Custom Input Styling */
        #custom-input-container, #range-input-container { display: none; margin-top: 10px; gap: 10px; }
        .range-inputs { display: flex; gap: 10px; }
        .range-inputs input { text-align: center; }

        #quiz-screen, #result-screen { display: none; }
        .level-badge { background: #e8f5e9; color: #27ae60; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        h1 { font-size: 85px; margin: 5px 0; color: #2c3e50; }
        #english-hint { font-size: 18px; color: #3498db; height: 25px; margin-bottom: 25px; font-weight: 500; visibility: hidden; }
        #answer-input { font-size: 22px; border: 2px solid #eee; text-align: center; }
        
        .feedback { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 25px; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
        
        .missed-list { text-align: left; max-height: 180px; overflow-y: auto; background: #fdfdfd; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; margin-top: 10px; font-size: 14px; }
        .missed-item { margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card">
    <div id="menu-screen">
        <h2 style="margin-top:0">HSK Pinyin Master</h2>
        
        <div class="menu-group">
            <label>HSK Level</label>
            <select id="hsk-level">
                <option value="1">Level 1 (150 words)</option>
                <option value="2">Level 2 (150 words)</option>
                <option value="3">Level 3 (300 words)</option>
            </select>
        </div>

        <div class="menu-group">
            <label>Question Selection</label>
            <select id="quiz-length-select" onchange="toggleInputs()">
                <option value="10">First 10 Words</option>
                <option value="25">First 25 Words</option>
                <option value="50">First 50 Words</option>
                <option value="all">Full Level Deck</option>
                <option value="range">Custom Range (e.g. 100-150)</option>
                <option value="custom">Custom Count (Random)...</option>
            </select>

            <div id="custom-input-container">
                <input type="number" id="custom-count" placeholder="How many words?" min="1">
            </div>

            <div id="range-input-container">
                <div class="range-inputs">
                    <input type="number" id="range-start" placeholder="Start (e.g. 100)" min="1">
                    <input type="number" id="range-end" placeholder="End (e.g. 150)" min="1">
                </div>
                <p style="font-size: 11px; color: #999; margin: 5px 0;">Note: Word indices based on alphabetical order.</p>
            </div>
        </div>

        <div class="menu-group">
            <label>Word Order</label>
            <select id="quiz-order">
                <option value="ordered">Deck Order</option>
                <option value="random">Shuffle Order</option>
            </select>
        </div>

        <button onclick="startQuiz()">Start Practice</button>
    </div>

    <div id="quiz-screen">
        <div class="level-badge">HSK <span id="display-level">1</span></div>
        <div style="font-size: 12px; color: #999;">Progress: <span id="current-num">1</span> / <span id="total-num">10</span></div>
        <h1 id="hanzi">...</h1>
        <div id="english-hint">...</div>
        <input type="text" id="answer-input" placeholder="Type Pinyin" autocomplete="off">
        <div class="feedback" id="feedback"></div>
        <div style="font-size: 14px; color: #7f8c8d; margin-top: 15px;">Score: <span id="score">0</span></div>
    </div>

    <div id="result-screen">
        <h2>Quiz Results</h2>
        <p id="final-score-text" style="font-size: 20px; font-weight: bold;"></p>
        <div id="review-section">
            <label>Words to Review:</label>
            <div class="missed-list" id="missed-list"></div>
        </div>
        <button onclick="location.reload()" style="background:#3498db;">Main Menu</button>
    </div>
</div>

    let activeDeck = [];
    let currentIdx = 0;
    let score = 0;
    let isLocked = false;
    let missedWords = [];

    function simplifyPinyin(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function toggleInputs() {
        const select = document.getElementById('quiz-length-select');
        document.getElementById('custom-input-container').style.display = (select.value === 'custom') ? 'block' : 'none';
        document.getElementById('range-input-container').style.display = (select.value === 'range') ? 'block' : 'none';
    }

    function startQuiz() {
        const level = document.getElementById('hsk-level').value;
        const lengthMode = document.getElementById('quiz-length-select').value;
        const order = document.getElementById('quiz-order').value;
        
        let deck = [...vocab[level]]; // Alphabetical by default
        let finalDeck = [];

        if (lengthMode === 'all') {
            finalDeck = deck;
        } else if (lengthMode === 'range') {
            const start = parseInt(document.getElementById('range-start').value) - 1;
            const end = parseInt(document.getElementById('range-end').value);
            if (isNaN(start) || isNaN(end) || start < 0 || end > deck.length || start >= end) {
                return alert(`Invalid Range! Level ${level} has ${deck.length} words.`);
            }
            finalDeck = deck.slice(start, end);
        } else if (lengthMode === 'custom') {
            const count = parseInt(document.getElementById('custom-count').value);
            if (isNaN(count) || count < 1) return alert("Enter a valid number!");
            // For custom random count, we shuffle first then slice
            deck.sort(() => Math.random() - 0.5);
            finalDeck = deck.slice(0, count);
        } else {
            finalDeck = deck.slice(0, parseInt(lengthMode));
        }

        // Apply final shuffle if requested (unless already handled by custom count)
        if (order === 'random' && lengthMode !== 'custom') {
            finalDeck.sort(() => Math.random() - 0.5);
        }

        activeDeck = finalDeck;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('display-level').innerText = level;
        document.getElementById('total-num').innerText = activeDeck.length;
        
        currentIdx = 0; score = 0; missedWords = [];
        nextWord();
    }

    // Logic for nextWord, checkAnswer, and Results stays same as previous...
    function nextWord() {
        if (currentIdx >= activeDeck.length) return showFinalResults();
        isLocked = false;
        const word = activeDeck[currentIdx];
        document.getElementById('hanzi').innerText = word.h;
        document.getElementById('english-hint').innerText = word.e;
        document.getElementById('english-hint').style.visibility = "hidden";
        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('current-num').innerText = currentIdx + 1;
        document.getElementById('answer-input').focus();
    }

    function checkAnswer() {
        if (isLocked) return;
        const raw = document.getElementById('answer-input').value.trim();
        if (!raw) return;

        isLocked = true;
        const input = simplifyPinyin(raw);
        const correct = simplifyPinyin(activeDeck[currentIdx].p);
        const feedback = document.getElementById('feedback');
        document.getElementById('english-hint').style.visibility = "visible";

        if (input === correct) {
            feedback.innerText = "Correct! ✅ " + activeDeck[currentIdx].p;
            feedback.className = "feedback correct";
            score++;
            document.getElementById('score').innerText = score;
        } else {
            feedback.innerText = "Wrong ❌: " + activeDeck[currentIdx].p;
            feedback.className = "feedback wrong";
            missedWords.push(activeDeck[currentIdx]);
        }
        currentIdx++;
        setTimeout(nextWord, 1800);
    }

    function showFinalResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score-text').innerText = `${score} / ${activeDeck.length}`;
        const listEl = document.getElementById('missed-list');
        listEl.innerHTML = "";
        if (missedWords.length === 0) {
            document.getElementById('review-section').innerHTML = "<strong>Perfect score! 🏆</strong>";
        } else {
            missedWords.forEach(w => {
                const div = document.createElement('div');
                div.className = "missed-item";
                div.innerHTML = `<b>${w.h}</b> - ${w.p} <br><small>${w.e}</small>`;
                listEl.appendChild(div);
            });
        }
    }

    document.getElementById('answer-input').addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
    });
</script>

</body>
</html>
